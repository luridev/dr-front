name: Playwright Linux diagnostics

on:
  # A new workflow cannot be dispatched until it exists on the default branch.
  push:
    branches:
      - diagnose-playwright-linux
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright:
    if: github.repository == 'luridev/dr-front'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Record environment and browser versions
        shell: bash
        run: |
          mkdir -p reports/linux-diagnostics
          {
            cat /etc/os-release
            uname -a
            node --version
            npm --version
            npx playwright --version
            sha256sum package-lock.json
            node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          for (const type of [chromium]) {
            const browser = await type.launch();
            console.log(type.name(), browser.version(), type.executablePath());
            await browser.close();
          }
          NODE
          } | tee reports/linux-diagnostics/environment.log

      - name: Verify input layout and four MaskedInput scenarios with one worker
        shell: bash
        env:
          CI: 'true'
          DR_MASK_DIAGNOSTICS: '0'
          DEBUG: pw:api,pw:browser
          PLAYWRIGHT_HTML_OUTPUT_DIR: ${{ runner.temp }}/playwright-targeted-html
          PLAYWRIGHT_HTML_OPEN: never
        run: |
          npx playwright test --project=components --workers=1 --trace=on \
            --grep 'input layout|external changes and config replacement preserve models|readonly and disabled block history|placeholders remain empty|external updates keep ordinary Pattern undo history' \
            --reporter=line,html --output=reports/linux-diagnostics/targeted-results \
            2>&1 | tee reports/linux-diagnostics/targeted.log

      - name: Install remaining browsers for release checks
        run: npx playwright install --with-deps firefox webkit

      - name: Run complete release checks after the targeted scenarios
        shell: bash
        env:
          CI: 'true'
          DR_MASK_DIAGNOSTICS: '0'
        run: npm run check:release 2>&1 | tee reports/linux-diagnostics/check-release.log

      - name: Preserve logs, traces, screenshots and error contexts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-linux-${{ matrix.os }}-${{ github.run_attempt }}
          path: |
            reports/linux-diagnostics/
            test-results/
            ${{ runner.temp }}/playwright-targeted-html/
          if-no-files-found: warn
          retention-days: 14
